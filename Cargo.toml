[package]
name = "basalt-plugin-swarm-competitive"
version = "0.1.0"
edition = "2021"
description = "Reference Swarm Strategy Plugin for Basalt implementing Speculative Competitive Racing with Semantic Telemetry"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
basalt-plugin-sdk = { git = "https://github.com/adevcorn/basalt-plugin-sdk", tag = "v0.1.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
